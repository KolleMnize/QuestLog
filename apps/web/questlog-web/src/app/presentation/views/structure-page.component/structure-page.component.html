<button type="button" class="btn btn-primary" (click)="AddCampaign()">Add newCampaign</button>
<div>
  <input
    type="text"
    class="form-control-plaintext"
    placeholder="Campaign name"
    [(ngModel)]="inputCampaignName"
  />
</div>
<div class="accordion" id="accordionExample">
  @if (campaigns()[0]) {
    @for (campaign of campaigns(); track campaigns.length) {
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingOne">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            [attr.data-bs-target]="'#collapse-' + campaign.id"
            aria-expanded="false"
            [attr.aria-controls]="'collapse-' + campaign.id"
          >
            {{ campaign.name }}
          </button>
        </h2>
        <div
          [id]="'collapse-' + campaign.id"
          class="accordion-collapse collapse"
          aria-labelledby="headingOne"
          data-bs-parent="#accordionExample"
          style=""
        >
          <div class="accordion-body">
            <div>
              <div class="btn-group">
                <button
                  class="btn btn-sm btn-outline-secondary"
                  (click)="AddChapterToCampaign(campaign)"
                >
                  +
                </button>
                <button class="btn btn-sm btn-primary">Bearbeiten</button>
                <button class="btn btn-sm btn-danger">Löschen</button>
              </div>
            </div>
            @for (chapter of campaign?.chapters; track $index) {
              <ng-container *ngTemplateOutlet="tpl; context: { $implicit: chapter }">
              </ng-container>
            }
            <ng-template #tpl let-chapter>
              <ul>
                <li>
                  <div class="list-group-item d-flex justify-content-between align-items-center">
                    <p>{{ chapter.name }}</p>
                    <div class="btn-group">
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        (click)="AddSubChapterToChapter(campaign, chapter)"
                      >
                        +
                      </button>
                      <button class="btn btn-sm btn-primary">Bearbeiten</button>
                      <button class="btn btn-sm btn-danger">Löschen</button>
                    </div>
                  </div>
                  @if (chapter.subChapters?.length) {
                    @for (sub of chapter.subChapters; track $index) {
                      <ng-container *ngTemplateOutlet="tpl; context: { $implicit: sub }">
                      </ng-container>
                    }
                  }
                </li>
              </ul>
            </ng-template>
          </div>
        </div>
      </div>
    }
  }
</div>
